services:
  tts_server:
    profiles:
      - default
      - full
    restart: unless-stopped  
    image: tts_server:1.0
    container_name: tts_server
    hostname: tts_server
    environment:
      # the admin routes (README "Releasing the GPU"); unset = none. Kept in ./.env (git-ignored)
      - SPEECH_ADMIN_SECRET=${SPEECH_ADMIN_SECRET:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: "all"
              capabilities: [gpu]
    logging:
      options:
        max-size: "10m"
        max-file: "3"    
    networks:
      logus2k_network:
    ports:
      - "7700:7700"
    volumes:
      - ~/env/assets/tts_server/data:/tts_server/data:ro

networks:
  logus2k_network:
    external: true
