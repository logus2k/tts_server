services:
  tts_server:
    profiles:
      - default
      - full
    restart: unless-stopped  
    image: tts_server:1.0
    container_name: tts_server
    hostname: tts_server
    environment:
      # the admin routes (README "Releasing the GPU"); unset = none. Kept in ./.env (git-ignored)
      - SPEECH_ADMIN_SECRET=${SPEECH_ADMIN_SECRET:-}
      # the European Portuguese voices (/synthesize), tts_eu_pt 0.1.32: the licence-clean model and the four voices the
      # listener chose in the Voice Blender (2026-11-01), in data/eu_pt (git-ignored); the earlier voices are in
      # data/eu_pt/backup_pre_clean_20261101
      - TTS_EU_PT_MODEL=/tts_server/data/eu_pt/eu_pt_kokoro.pth
      - TTS_EU_PT_VOICEPACK=/tts_server/data/eu_pt/ana_voicepack.pt
      - TTS_EU_PT_JOAO_VOICEPACK=/tts_server/data/eu_pt/joao_voicepack.pt
      - TTS_EU_PT_AMELIA_VOICEPACK=/tts_server/data/eu_pt/amelia_voicepack.pt
      - TTS_EU_PT_RUI_VOICEPACK=/tts_server/data/eu_pt/rui_voicepack.pt
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: "all"
              capabilities: [gpu]
    logging:
      options:
        max-size: "10m"
        max-file: "3"    
    networks:
      logus2k_network:
    ports:
      - "7700:7700"
    volumes:
      - ~/env/assets/tts_server/data:/tts_server/data:ro

networks:
  logus2k_network:
    external: true
