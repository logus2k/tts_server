services:
  tts_server:
    profiles:
      - default
      - full
    restart: unless-stopped  
    image: tts_server:1.0
    container_name: tts_server
    hostname: tts_server
    environment:
      # the admin routes (README "Releasing the GPU"); unset = none. Kept in ./.env (git-ignored)
      - SPEECH_ADMIN_SECRET=${SPEECH_ADMIN_SECRET:-}
      # the European Portuguese voice (pt_tuga, /synthesize): weights copied from the HF cache of logus2k/kokoro_tts_eu_pt into data/eu_pt (git-ignored)
      - TTS_EU_PT_MODEL=/tts_server/data/eu_pt/tuga_kokoro.pth
      - TTS_EU_PT_VOICEPACK=/tts_server/data/eu_pt/tuga_voicepack.pt
      # the male voice pt_joao (the Tugão 1.0 speaker, CC0, extracted from the same epoch-19 model)
      - TTS_EU_PT_JOAO_VOICEPACK=/tts_server/data/eu_pt/joao_voicepack.pt
      # PRIVATE pt-PT pronunciations from Infopédia (© Porto Editora) for words tugalex lacks: internal use only, not to
      # be published before Porto Editora's permission (tts_eu_pt open issue 5). Built by tts_eu_pt's
      # scripts/build_extra_lexicon.py into data/eu_pt (git-ignored). Remove this line to switch it off.
      - TTS_EU_PT_EXTRA_LEXICON=/tts_server/data/eu_pt/extra_lexicon_ptpt.tsv
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: "all"
              capabilities: [gpu]
    logging:
      options:
        max-size: "10m"
        max-file: "3"    
    networks:
      logus2k_network:
    ports:
      - "7700:7700"
    volumes:
      - ~/env/assets/tts_server/data:/tts_server/data:ro

networks:
  logus2k_network:
    external: true
